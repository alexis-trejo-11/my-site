@if (node(); as current) {
  @if (current.type === 'folder') {
    <div class="space-y-[2px]">
      <button
        type="button"
        (click)="onToggle()"
        class="flex w-full items-center gap-2 px-2 py-1 hover:bg-surface-variant/30 rounded cursor-pointer group text-on-surface text-left transition-colors"
        [style.padding-left]="paddingLeft()"
      >
        <span
          class="material-symbols-outlined text-sm text-on-surface-variant group-hover:text-primary transition-colors"
          data-icon="folder"
        >
          {{ isFolderOpen() ? 'folder_open' : 'folder' }}
        </span>
        <span class="font-code-sm text-code-sm truncate">{{ current.name }}</span>
      </button>

      @if (isFolderOpen()) {
        <div class="space-y-[2px]">
          @for (child of current.children; track child.id) {
            <app-explorer-tree-node
              [node]="child"
              [depth]="depth() + 1"
              [expandedIds]="expandedIds()"
              [selectedId]="selectedId()"
              [forceExpand]="forceExpand()"
              [leafTemplate]="leafTemplate()"
              (toggleId)="onChildToggle($event)"
              (selectLeaf)="onChildSelect($event)"
            />
          }
        </div>
      }
    </div>
  } @else if (leafTemplate(); as tpl) {
    <ng-container
      [ngTemplateOutlet]="tpl"
      [ngTemplateOutletContext]="leafContext()"
    />
  } @else {
    <button
      type="button"
      (click)="onSelectLeaf()"
      class="flex w-full items-center gap-2 px-2 py-1 rounded cursor-pointer group text-left transition-colors"
      [class.bg-primary/10]="isSelected()"
      [class.border-l-2]="isSelected()"
      [class.border-primary]="isSelected()"
      [class.rounded-r]="isSelected()"
      [class.text-primary]="isSelected()"
      [class.text-on-surface-variant]="!isSelected()"
      [class.hover:bg-surface-variant/30]="!isSelected()"
      [style.padding-left]="paddingLeft()"
    >
      <span class="font-code-sm text-code-sm truncate">{{ current.name }}</span>
    </button>
  }
}
