<aside
  class="flex h-full min-h-0 w-full flex-col border-l ide-border bg-surface-container-low overflow-y-auto"
>
  @if (store.activeNote(); as note) {
    <div class="p-6 space-y-8">
      <div class="pb-6 border-b ide-border">
        <h4
          class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider mb-4 flex items-center gap-2"
        >
          <span class="material-symbols-outlined text-[16px]">info</span>
          Metadata
        </h4>
        <div class="font-code-sm text-code-sm text-on-surface-variant space-y-3">
          <div>
            <span class="block mb-1 text-on-surface-variant/80">Path</span>
            <span class="text-on-surface break-all">{{ note.id }}</span>
          </div>
          <div>
            <span class="block mb-1 text-on-surface-variant/80">Asset</span>
            <span class="text-on-surface break-all">{{ note.contentSrc }}</span>
          </div>
          <div class="flex justify-between gap-3">
            <span>Order</span>
            <span class="text-on-surface tabular-nums">{{ note.order }}</span>
          </div>
        </div>
      </div>

      @if (store.siblingNotes().length) {
        <div>
          <h4
            class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider mb-4 flex items-center gap-2"
          >
            <span class="material-symbols-outlined text-[16px]">link</span>
            Related Notes
          </h4>
          <ul class="space-y-2">
            @for (sibling of store.siblingNotes(); track sibling.id) {
              <li>
                <button
                  type="button"
                  class="flex w-full items-start gap-2 font-body-md text-sm text-on-surface-variant hover:text-primary transition-colors text-left cursor-pointer"
                  (click)="selectNote(sibling.id)"
                >
                  <span class="material-symbols-outlined text-[16px] mt-0.5 shrink-0"
                    >description</span
                  >
                  <span>{{ sibling.name }}</span>
                </button>
              </li>
            }
          </ul>
        </div>
      }
    </div>
  }
</aside>
