<button
  type="button"
  (click)="onSelect()"
  class="flex w-full items-center gap-2 px-2 py-1 rounded cursor-pointer group text-left transition-colors"
  [class.bg-primary/10]="selected()"
  [class.border-l-2]="selected()"
  [class.border-primary]="selected()"
  [class.rounded-r]="selected()"
  [class.text-primary]="selected()"
  [class.text-on-surface-variant]="!selected()"
  [class.hover:bg-surface-variant/30]="!selected()"
  [style.padding-left]="paddingLeft()"
>
  <span
    class="material-symbols-outlined text-[14px] shrink-0"
    [class.text-primary]="selected()"
  >
    description
  </span>
  <span class="font-code-sm text-code-sm truncate">{{ note().name }}</span>
</button>
