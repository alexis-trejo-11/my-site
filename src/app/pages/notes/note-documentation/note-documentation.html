<div class="flex flex-1 min-w-0 min-h-0 flex-col bg-surface">
  <div
    class="sticky top-0 z-20 flex items-center justify-between gap-1 px-4 md:px-6 py-2 border-b ide-border bg-surface/90 backdrop-blur-xl shrink-0"
  >
    <button
      type="button"
      class="inline-flex items-center gap-1.5 p-2 rounded-lg border transition-colors"
      [class.text-primary]="explorerOpen()"
      [class.bg-white/5]="explorerOpen()"
      [class.border-white/10]="explorerOpen()"
      [class.text-on-surface-variant]="!explorerOpen()"
      [class.border-transparent]="!explorerOpen()"
      [class.hover:bg-white/5]="!explorerOpen()"
      [class.hover:text-on-surface]="!explorerOpen()"
      (click)="explorerToggle.emit()"
      [attr.aria-label]="explorerOpen() ? 'Hide vault explorer' : 'Show vault explorer'"
      [title]="explorerOpen() ? 'Hide explorer' : 'Show explorer'"
    >
      <span class="material-symbols-outlined text-[20px]">
        {{ explorerOpen() ? 'left_panel_close' : 'left_panel_open' }}
      </span>
      @if (!explorerOpen()) {
        <span class="font-label-md text-label-md">Vault</span>
      }
    </button>
    <button
      type="button"
      class="inline-flex items-center gap-1.5 p-2 rounded-lg border transition-colors"
      [class.text-primary]="metadataOpen()"
      [class.bg-white/5]="metadataOpen()"
      [class.border-white/10]="metadataOpen()"
      [class.text-on-surface-variant]="!metadataOpen()"
      [class.border-transparent]="!metadataOpen()"
      [class.hover:bg-white/5]="!metadataOpen()"
      [class.hover:text-on-surface]="!metadataOpen()"
      (click)="metadataToggle.emit()"
      [attr.aria-label]="metadataOpen() ? 'Hide note metadata' : 'Show note metadata'"
      [title]="metadataOpen() ? 'Hide metadata' : 'Show metadata'"
    >
      <span class="material-symbols-outlined text-[20px]">
        {{ metadataOpen() ? 'right_panel_close' : 'right_panel_open' }}
      </span>
      @if (!metadataOpen()) {
        <span class="font-label-md text-label-md">Metadata</span>
      }
    </button>
  </div>

  <div class="flex-1 min-h-0 overflow-y-auto flex justify-center">
    @if (note(); as active) {
      <div class="max-w-3xl w-full p-8 md:p-12 lg:p-16 flex flex-col">
        <div
          class="flex flex-wrap items-center gap-2 text-on-surface-variant font-code-sm text-code-sm mb-6"
        >
          @for (crumb of folderCrumbs(); track crumb.id) {
            <span>{{ crumb.name }}</span>
            <span class="material-symbols-outlined text-[14px]">chevron_right</span>
          }
          <span class="text-primary">{{ active.name }}</span>
        </div>

        <div class="note-markdown font-body-lg text-body-lg leading-relaxed">
          <markdown [src]="active.contentSrc" [disableSanitizer]="true" />
        </div>
      </div>
    } @else {
      <div
        class="flex flex-1 items-center justify-center p-12 text-on-surface-variant font-code-sm text-code-sm"
      >
        Select a note from the vault.
      </div>
    }
  </div>
</div>
