<div
  class="group flex w-full items-center rounded transition-colors"
  [class.bg-primary/10]="selected()"
  [class.border-l-2]="selected()"
  [class.border-primary]="selected()"
  [class.text-primary]="selected()"
  [class.text-on-surface-variant]="!selected()"
  [class.hover:bg-surface-variant/30]="!selected()"
>
  <button
    type="button"
    (click)="onSelect()"
    class="flex min-w-0 flex-1 cursor-pointer items-center gap-2 py-1 pr-1 text-left"
    [style.padding-left]="paddingLeft()"
  >
    <span class="w-8 shrink-0 text-[10px] font-bold {{ badge().colorClass }}">{{
      badge().label
    }}</span>
    <span class="truncate font-code-sm text-code-sm">{{ label() }}</span>
  </button>
  @if (manageable()) {
    <div class="mr-1 hidden shrink-0 items-center group-hover:flex">
      <button
        type="button"
        class="rounded p-1 text-on-surface-variant hover:bg-surface-variant hover:text-primary"
        aria-label="Rename request"
        title="Rename"
        (click)="rename.emit()"
      >
        <span class="material-symbols-outlined text-[14px]">edit</span>
      </button>
      <button
        type="button"
        class="rounded p-1 text-on-surface-variant hover:bg-error/10 hover:text-error"
        aria-label="Delete request"
        title="Delete"
        (click)="remove.emit()"
      >
        <span class="material-symbols-outlined text-[14px]">delete</span>
      </button>
    </div>
  }
</div>
