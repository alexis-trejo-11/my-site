<div class="space-y-[2px]">
  <button
    type="button"
    (click)="onToggle()"
    class="flex w-full items-center gap-2 px-2 py-1 hover:bg-surface-variant/30 rounded cursor-pointer group text-on-surface text-left transition-colors"
    [style.padding-left]="paddingLeft()"
  >
    <span
      class="material-symbols-outlined text-sm text-on-surface-variant group-hover:text-primary transition-colors"
      data-icon="folder"
    >
      {{ isOpen() ? 'folder_open' : 'folder' }}
    </span>
    <span class="font-code-sm text-code-sm truncate">{{ name() }}</span>
  </button>

  @if (isOpen()) {
    <div class="space-y-[2px]">
      @for (item of items(); track item.id) {
        @if (item.type === 'FOLDER') {
          <app-collection-folder
            [folderId]="item.id"
            [name]="item.name"
            [items]="item.items"
            [depth]="depth() + 1"
          />
        } @else {
          <app-request-item [request]="item" [depth]="depth() + 1" />
        }
      }
    </div>
  }
</div>
